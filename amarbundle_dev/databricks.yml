# This is a Declarative Automation Bundle definition for amarbundle_dev.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: amarbundle_dev
  uuid: 7097928a-3130-40e3-88e5-6269688f4fa2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c55b696d-8e3e.cloud.databricks.com
    variables:
      catalog: bundle_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-c55b696d-8e3e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/amar.kaliaperumal@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/amar.kaliaperumal@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bundle_dev
      schema: rnd
    permissions:
      - user_name: amar.kaliaperumal@gmail.com
        level: CAN_MANAGE
